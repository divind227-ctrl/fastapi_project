<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1: #EAF6FF;
    --sky-2: #D3ECFA;
    --sky-3: #BFE3F5;
    --white: #FFFFFF;
    --ink: #2B3A45;
    --muted: #6C8494;
    --rose: #FF8FA3;
    --rose-deep: #F26E86;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--sky-1), var(--sky-2) 55%, var(--sky-3));
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  .scene{
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8vh 6vw 10vh;
    text-align: center;
  }

  /* ambient floating hearts */
  .float-heart{
    position: absolute;
    bottom: -10%;
    opacity: 0.35;
    animation: rise linear infinite;
    pointer-events: none;
  }

  @keyframes rise{
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.35; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; }
  }

  .eyebrow{
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-bottom: 0.8rem;
  }

  h1{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    line-height: 1.25;
    margin: 0 0 1rem 0;
    max-width: 16ch;
    color: var(--ink);
  }

  p.lede{
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 40ch;
    margin: 0 0 3.2rem 0;
    line-height: 1.6;
  }

  .hearts{
    display: flex;
    flex-wrap: wrap;
    gap: 1.4rem;
    justify-content: center;
    max-width: 520px;
    margin-bottom: 2.4rem;
  }

  .heart-btn{
    position: relative;
    width: 78px;
    height: 70px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }

  .heart-btn svg{
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 14px rgba(242,110,134,0.25));
    transition: transform 220ms ease;
  }

  .heart-btn:hover svg,
  .heart-btn:focus-visible svg{
    transform: scale(1.08);
  }

  .heart-btn.used svg{
    opacity: 0.55;
  }

  .heart-btn:focus-visible{
    outline: 2px solid var(--rose-deep);
    outline-offset: 4px;
    border-radius: 50%;
  }

  .card{
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 18px;
    padding: 2.2rem 2.4rem;
    max-width: 420px;
    min-height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 24px 50px -20px rgba(90,140,170,0.35);
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    transition: opacity 320ms ease, transform 320ms ease;
  }

  .card.show{
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .card p{
    margin: 0;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.5;
    color: var(--ink);
  }

  .card p.apology{
    color: var(--rose-deep);
  }

  footer{
    margin-top: 3rem;
    font-size: 0.82rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    .float-heart{ animation: none; opacity: 0.15; }
  }
</style>
</head>
<body>

  <div class="scene" id="scene">

    <span class="eyebrow">a little something for you</span>
    <h1>Every heart here holds<br>a piece of how I feel.</h1>
    <p class="lede">Touch a heart, one at a time — each one has something I wanted to tell you.</p>

    <div class="hearts" id="hearts">
      <button class="heart-btn" data-msg="0" aria-label="Heart 1">
        <svg viewBox="0 0 32 29"><path fill="#FF8FA3" d="M16 29S2 19.4 2 10.2C2 4.6 6.2 1 10.9 1c2.8 0 5 1.4 6.1 3.5C18.1 2.4 20.3 1 23.1 1 27.8 1 32 4.6 32 10.2 32 19.4 16 29 16 29z" transform="translate(-2,-1)"/></svg>
      </button>
      <button class="heart-btn" data-msg="1" aria-label="Heart 2">
        <svg viewBox="0 0 32 29"><path fill="#7FC8E8" d="M16 29S2 19.4 2 10.2C2 4.6 6.2 1 10.9 1c2.8 0 5 1.4 6.1 3.5C18.1 2.4 20.3 1 23.1 1 27.8 1 32 4.6 32 10.2 32 19.4 16 29 16 29z" transform="translate(-2,-1)"/></svg>
      </button>
      <button class="heart-btn" data-msg="2" aria-label="Heart 3">
        <svg viewBox="0 0 32 29"><path fill="#FFC1CC" d="M16 29S2 19.4 2 10.2C2 4.6 6.2 1 10.9 1c2.8 0 5 1.4 6.1 3.5C18.1 2.4 20.3 1 23.1 1 27.8 1 32 4.6 32 10.2 32 19.4 16 29 16 29z" transform="translate(-2,-1)"/></svg>
      </button>
      <button class="heart-btn" data-msg="3" aria-label="Heart 4">
        <svg viewBox="0 0 32 29"><path fill="#A7DAF0" d="M16 29S2 19.4 2 10.2C2 4.6 6.2 1 10.9 1c2.8 0 5 1.4 6.1 3.5C18.1 2.4 20.3 1 23.1 1 27.8 1 32 4.6 32 10.2 32 19.4 16 29 16 29z" transform="translate(-2,-1)"/></svg>
      </button>
      <button class="heart-btn" data-msg="4" aria-label="Heart 5">
        <svg viewBox="0 0 32 29"><path fill="#F26E86" d="M16 29S2 19.4 2 10.2C2 4.6 6.2 1 10.9 1c2.8 0 5 1.4 6.1 3.5C18.1 2.4 20.3 1 23.1 1 27.8 1 32 4.6 32 10.2 32 19.4 16 29 16 29z" transform="translate(-2,-1)"/></svg>
      </button>
    </div>

    <div class="card" id="card">
      <p id="cardText"></p>
    </div>

    <footer>tap each heart once — they don't repeat</footer>
  </div>

<script>
  const messages = [
    "You're so cute, it genuinely catches me off guard sometimes.",
    "Even your moods are part of you, and I love all of it.",
    "You're my angel.",
    "You're my motivation.",
  ];
  const apology = "And I'm sorry for hurting you. That was never what I wanted.";

  const buttons = document.querySelectorAll('.heart-btn');
  const card = document.getElementById('card');
  const cardText = document.getElementById('cardText');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('used')) return;
      btn.classList.add('used');

      const idx = Number(btn.dataset.msg);
      const isLast = idx === 4;
      const text = isLast ? apology : messages[idx];

      card.classList.remove('show');
      cardText.classList.toggle('apology', isLast);
      setTimeout(() => {
        cardText.textContent = text;
        card.classList.add('show');
      }, 160);
    });
  });

  // ambient floating hearts
  const scene = document.getElementById('scene');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['#FF8FA3', '#7FC8E8', '#FFC1CC', '#A7DAF0'];

  function spawnHeart(){
    const el = document.createElement('div');
    el.className = 'float-heart';
    const size = 14 + Math.random() * 16;
    const left = Math.random() * 100;
    const duration = 10 + Math.random() * 8;
    const color = colors[Math.floor(Math.random() * colors.length)];
    el.style.left = left + 'vw';
    el.style.animationDuration = duration + 's';
    el.innerHTML = `<svg width="${size}" height="${size * 0.9}" viewBox="0 0 32 29"><path fill="${color}" d="M16 29S2 19.4 2 10.2C2 4.6 6.2 1 10.9 1c2.8 0 5 1.4 6.1 3.5C18.1 2.4 20.3 1 23.1 1 27.8 1 32 4.6 32 10.2 32 19.4 16 29 16 29z"/></svg>`;
    scene.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }

  if (!reduceMotion){
    for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 900);
    setInterval(spawnHeart, 1600);
  }
</script>

</body>
</html>
